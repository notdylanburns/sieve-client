[package]
name = "sieve-desktop-manager"
version = "0.2.0"
edition = "2024"

[dependencies]
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
log = "0.4.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
